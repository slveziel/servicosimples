runtime: php82

instance_class: F2

runtime_config:
  document_root: public
  php_ini_file: php.ini

env_variables:
  APP_ENV: production
  APP_KEY: "base64:Rl1kkZGCOJVgFKQCKrCQbRXuPKoIX3t6YXEY4h2oOVc="
  APP_DEBUG: "false"
  LOG_CHANNEL: "stderr"
  
  # Database - Cloud SQL MySQL (IP Público)
  DB_CONNECTION: "mysql"
  DB_HOST: "34.41.161.243"
  DB_PORT: "3306"
  DB_DATABASE: "servicosimples"
  DB_USERNAME: "servicosimples"
  DB_PASSWORD: "servicosimples123"
  
  # Cache & Session
  CACHE_DRIVER: "database"
  SESSION_DRIVER: "database"
  QUEUE_CONNECTION: "sync"

  # Storage
  FILESYSTEM_DISK: "local"

  # Locale
  APP_LOCALE: "pt_BR"
  APP_FALLBACK_LOCALE: "pt_BR"

entrypoint: bash entrypoint.sh

handlers:
- url: /
  script: auto
  secure: always
  
- url: /index\.php
  script: auto
  secure: always

- url: /assets
  static_dir: public/assets
  secure: always
  
- url: /favicon\.ico
  static_files: public/favicon.ico
  upload: public/favicon.ico
  secure: always

- url: /.*
  script: auto
  secure: always

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
